[package]
name = "distributed-rate-limiter"
version = "0.1.0"
edition = "2024"
authors = ["Davi Gomes <davigomescarmo9@gmail.com>"]
description = "Distributed rate limiter in Rust (Token Bucket and Sliding Window) with Redis, Actix middleware, and Prometheus metrics"
license = "MIT"
keywords = ["rate-limiter", "redis", "distributed", "token-bucket", "rust"]
categories = ["network-programming", "web-programming", "asynchronous"]
readme = "README.md"
repository = "https://github.com/YOUR_USERNAME/distributed-rate-limiter"

[lib]
name = "distributed_rate_limiter"
path = "src/lib.rs"

[[bin]]
name = "distributed-rate-limiter"
path = "src/main.rs"

[[bench]]
name = "limiter_bench"
harness = false

[dependencies]
actix-web = "4.17.0"
async-trait = "0.1.92"
dotenvy = "0.15.7"
futures-util = "0.3.34"
prometheus = "0.14.0"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
mockall = "0.15.0"
