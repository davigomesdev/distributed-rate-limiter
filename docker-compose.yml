services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rate-limiter:
    build: .
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: "0.0.0.0:8080"
      REDIS_URL: "redis://redis:6379"
      ALGORITHM: "token_bucket"
      TB_CAPACITY: "100"
      TB_REFILL_PER_SEC: "10"
      SW_LIMIT: "100"
      SW_WINDOW_MS: "60000"
      FAIL_OPEN: "true"
      RUST_LOG: "info"
    depends_on:
      redis:
        condition: service_healthy
